<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitFlys | Çok Yakında Sizlerle</title>
  <meta name="description" content="FitFlys çok yakında sizlerle.">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #08090d;
    }
    .glow-orb {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(60px);
    }
    .gradient-text {
      background: linear-gradient(135deg, #10b981 0%, #34d399 50%, #a3e635 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="h-full flex items-center justify-center text-white relative overflow-hidden selection:bg-emerald-500 selection:text-black">

  <!-- Subtle Ambient Glow -->
  <div class="glow-orb top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

  <!-- Minimalist Centered Content -->
  <main class="text-center px-6 z-10 space-y-5">
    
    <!-- Logo Icon -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-lime-400 text-black shadow-2xl shadow-emerald-500/20 mb-2">
      <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>

    <!-- Main Text -->
    <div class="space-y-3">
      <h1 class="text-5xl sm:text-6xl md:text-7xl font-black tracking-tight uppercase">
        FIT<span class="gradient-text">FLYS</span>
      </h1>
      <p class="text-xl sm:text-2xl md:text-3xl font-light tracking-wide text-zinc-300">
        Çok yakında sizlerle.
      </p>
    </div>

    <!-- Subtitle / Domain -->
    <div class="pt-4">
      <span class="text-xs uppercase tracking-[0.3em] text-zinc-500 font-medium">
        fitflys.com
      </span>
    </div>

  </main>

</body>
</html>
